<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>DentaCare - configuration du poste</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 14px "Segoe UI", system-ui, sans-serif; color: #222429;
         background: linear-gradient(135deg, #14B1BB, #21CDC0); }
  .card { width: 520px; background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 24px 60px rgba(34,36,41,.25); }
  h1 { margin: 0 0 4px; font-size: 22px; } p { color: #696969; margin: 0 0 20px; }
  label.opt { display: block; border: 1px solid #E6E8EA; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
  label.opt:has(input:checked) { border-color: #14B1BB; background: #E4F6F7; }
  label.opt b { display: block; } label.opt small { color: #696969; }
  input[type=text] { width: 100%; box-sizing: border-box; margin-top: 8px; height: 38px; border: 1px solid #D3D6DA; border-radius: 8px; padding: 0 10px; font: inherit; }
  button { margin-top: 12px; width: 100%; height: 42px; border: 0; border-radius: 8px; background: #14B1BB; color: #fff; font: 600 15px inherit; cursor: pointer; }
  button:hover { background: #0F959E; } .err { color: #B0202F; background: #FDECEE; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; display: none; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>DentaCare</h1>
    <p>Comment ce poste est-il utilisé au cabinet ?</p>
    <div class="err" id="err"></div>
    <label class="opt"><input type="radio" name="mode" value="server" checked /> <b>Poste serveur</b>
      <small>Ce poste garde la base de données. Les autres postes s'y connectent. Il doit rester allumé pendant les heures d'ouverture.</small></label>
    <label class="opt"><input type="radio" name="mode" value="client" /> <b>Poste du cabinet (client)</b>
      <small>Se connecte au poste serveur du réseau local.</small>
      <input type="text" id="url" placeholder="http://192.168.1.10:5080" autocomplete="off" /></label>
    <button type="submit">Enregistrer et démarrer</button>
  </form>
  <script src="connect.js"></script>
</body>
</html>
